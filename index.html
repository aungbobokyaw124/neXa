<!DOCTYPE html>
<html lang="my" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>neXa - Next Gen Platform</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/animation.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="nx-preloader" class="nx-preloader">
    <h1>
      <span id="nx-preloader-text" class="nx-typing-cursor"></span>
    </h1>
    <p id="nx-preloader-status"></p>
  </div>

  <div class="nx-announcement-bar">
    <div class="nx-container">
      <div id="nx-announcement-slider" class="nx-announcement-slider">
        <div class="nx-announcement-item nx-slide-active">🚀 neXa Platform v1.0 ကို စတင် မိတ်ဆက်လိုက်ပြီဖြစ်ပါတယ်။</div>
        <div class="nx-announcement-item nx-slide-hidden">🎉 အသစ်တင်ဆက်ထားသော Templates များကို လေ့လာကြည့်ရှုလိုက်ပါ။</div>
      </div>
    </div>
  </div>

  <header class="nx-header nx-glass-header">
    <div class="nx-container nx-header-container">
      <a href="#" class="nx-logo">neXa</a>
      
      <nav class="nx-nav">
        <button class="nx-btn nx-btn-outline nx-theme-toggle" aria-label="Toggle Theme">
          <span class="nx-icon-dark">🌙 Dark</span>
          <span class="nx-icon-light hidden">☀️ Light</span>
        </button>
        <button class="nx-btn nx-btn-primary" data-nx-modal-target="nx-login-modal">Login</button>
      </nav>
    </div>
  </header>

  <main class="nx-hero-section">
    <div class="nx-container">
      <div class="nx-hero-content">
        <h1 class="nx-hero-title nx-animate-on-scroll" data-nx-animation="nx-slide-up">
          Build Faster with <span class="nx-hero-highlight">neXa</span> Architecture
        </h1>
        <p class="nx-hero-subtitle nx-animate-on-scroll" data-nx-animation="nx-fade-in">
          Modular CSS & Vanilla JS ဖြင့် တည်ဆောက်ထားသော Production-Ready Web Template ဖြစ်ပါတယ်။
        </p>
        <div class="nx-hero-actions nx-animate-on-scroll" data-nx-animation="nx-fade-in">
          <button class="nx-btn nx-btn-primary nx-hero-btn" onclick="nxToast.success('neXa မှ ကြိုဆိုပါတယ်!')">
            Demo Toast စမ်းသပ်ရန်
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="nx-login-modal" class="nx-modal" aria-hidden="true">
    <div class="nx-card nx-modal-card">
      <button class="nx-modal-close" aria-label="Close modal">✕</button>
      <h2>Login to neXa</h2>
      <p class="nx-modal-desc">သင့်အကောင့်သို့ ဝင်ရောက်ပါ</p>
      <button class="nx-btn nx-btn-primary nx-full-width">Continue</button>
    </div>
  </div>

  <div id="nx-toast-container" class="nx-toast-container"></div>

  <script src="js/utils.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/preloader.js"></script>
  <script src="js/slider.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/toast.js"></script>
</body>
</html>
