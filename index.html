<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>neXa - Build Faster. Create Smarter.</title>
    <style>
        :root {
            --bg-primary: #0B1F3A;
            --accent: #10B981;
            --text-main: #FFFFFF;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        h1 span {
            color: var(--accent);
        }
        p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .btn {
            background-color: var(--accent);
            color: var(--bg-primary);
            padding: 12px 24px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>Welcome to <span>neXa</span></h1>
    <p>Build Faster. Create Smarter.</p>
    <a href="#" class="btn">Get Started</a>

</body>
</html>
